<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Days</title>
<meta name="description" content="Tap a day. Get a star. Free, no account.">
<meta property="og:type" content="website">
<meta property="og:title" content="Star Days">
<meta property="og:description" content="Tap a day. Get a star. Free, no account.">
<meta property="og:url" content="https://stardays.app/">
<meta property="og:image" content="https://stardays.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#1B2430;--mute:#7C8798;--line:#DCE2EC;--star:#F2B01E;--acc:#3D4FD8;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161D;--card:#1B212B;--ink:#EEF1F6;--mute:#8C97A8;--line:#2A3340;--star:#F6C244;--acc:#8C9BFF;--on:#12161D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161D;--card:#1B212B;--ink:#EEF1F6;--mute:#8C97A8;--line:#2A3340;--star:#F6C244;--acc:#8C9BFF;--on:#12161D;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding:20px 16px 28px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{cursor:pointer;margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stats{margin:6px 0 0;color:var(--mute);font-size:.95rem}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.3rem;cursor:pointer}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{margin:22px 0 6px;color:var(--mute);font-size:.8rem;text-align:center}
.cell{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;text-align:left;padding:6px 7px;cursor:pointer}
.cell.blank{visibility:hidden;pointer-events:none}
.cell.today{border:2px solid var(--acc);font-weight:800}
.cell.future{color:var(--mute);opacity:.45;cursor:default}
.cell svg{position:absolute;top:5px;right:5px;width:15px;height:15px;fill:var(--star);display:none}
.cell[aria-pressed="true"] svg{display:block}
.cell.pop svg{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.cell:focus-visible,.nav button:focus-visible,h1:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{display:block;width:100%;margin-top:20px;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:var(--on);font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
.go.done{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.hint{margin:16px 0 0;color:var(--mute);font-size:.9rem;line-height:1.4}
@media (prefers-reduced-motion:reduce){.cell.pop svg{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title" role="button" tabindex="0"></h1>
      <p class="stats" id="stats"></p>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Previous month">&#8249;</button>
      <button id="next" aria-label="Next month">&#8250;</button>
    </div>
  </header>
  <div class="dow" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
  <div class="grid" id="grid"></div>
  <p class="hint" id="hint"></p>
</main>
<script data-goatcounter="https://stardays.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(function(){
  var KEY='stardays.v1', marks={}, canSave=true;
  try{var raw=localStorage.getItem(KEY); if(raw) marks=JSON.parse(raw)||{};}catch(e){canSave=false;}
  var tk0=todayKey(), pruned=false; for(var kk in marks){if(kk>tk0){delete marks[kk]; pruned=true;}} if(pruned) save();
  var now=new Date(), view={y:now.getFullYear(), m:now.getMonth()};
  var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/></svg>';
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function track(name){var n=0;(function go(){try{if(window.goatcounter&&window.goatcounter.count){window.goatcounter.count({path:name,title:name,event:true});}else if(n++<20){setTimeout(go,300);}}catch(e){}})();}
  function key(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  function todayKey(){var t=new Date();return key(t.getFullYear(),t.getMonth(),t.getDate());}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(marks));}catch(e){canSave=false;}}
  function toggle(k){if(k>todayKey()) return; if(marks[k]) delete marks[k]; else marks[k]=1; save();}
  function streak(){
    var d=new Date(), n=0;
    if(!marks[key(d.getFullYear(),d.getMonth(),d.getDate())]) d.setDate(d.getDate()-1);
    while(marks[key(d.getFullYear(),d.getMonth(),d.getDate())]){n++; d.setDate(d.getDate()-1);}
    return n;
  }
  function render(popKey){
    var y=view.y, m=view.m, first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), tk=todayKey(), count=0;
    var tEl=document.getElementById('title'); tEl.textContent=MONTHS[m]+' '+y; tEl.setAttribute('aria-label',MONTHS[m]+' '+y+', jump to today');
    var html='';
    for(var i=0;i<first;i++) html+='<span class="cell blank"></span>';
    for(var d=1;d<=days;d++){
      var k=key(y,m,d), on=!!marks[k]; if(on) count++;
      var cls='cell'+(k===tk?' today':'')+(k>tk?' future':'')+(k===popKey?' pop':'');
      html+='<button class="'+cls+'" data-k="'+k+'" aria-pressed="'+on+'"'+(k>tk?' disabled':'')+' aria-label="'+MONTHS[m]+' '+d+(on?', starred':'')+'">'+d+STAR+'</button>';
    }
    document.getElementById('grid').innerHTML=html;
    var s=streak();
    document.getElementById('stats').textContent=count+(count===1?' star':' stars')+' this month'+(s>1?' \u00b7 '+s+' day streak':'');
    
    
    
    var hint=document.getElementById('hint');
    if(!canSave) hint.textContent='This browser can\u2019t save your stars, so they will reset when you close the page.';
    else if(!Object.keys(marks).length) hint.textContent='Tap any day to add a star. Tap again to remove it. Your stars stay on this device, no account needed. Anonymous visit counts only.';
    else hint.textContent='Your stars stay on this device, no account needed. Anonymous visit counts only.';
  }
  document.getElementById('grid').addEventListener('click',function(e){
    var b=e.target.closest('.cell[data-k]'); if(!b) return;
    var k=b.getAttribute('data-k'); toggle(k); if(marks[k]) track('star-added'); render(marks[k]?k:null);
    if(e.detail===0){var nb=document.querySelector('.cell[data-k="'+k+'"]'); if(nb) nb.focus({preventScroll:true});}
  });
  function goToday(){var t=new Date(); view={y:t.getFullYear(),m:t.getMonth()}; render();}
  var ttl=document.getElementById('title'); ttl.addEventListener('click',goToday); ttl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault(); goToday();}});
  document.getElementById('prev').addEventListener('click',function(){view.m--; if(view.m<0){view.m=11;view.y--;} render();});
  document.getElementById('next').addEventListener('click',function(){view.m++; if(view.m>11){view.m=0;view.y++;} render();});
  try{var seen=localStorage.getItem('stardays.seen'), td=todayKey(); if(seen&&seen!==td) track('return-visit'); localStorage.setItem('stardays.seen',td);}catch(e){}
  render();
})();
</script>
</body>
</html>
